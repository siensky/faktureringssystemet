# Startar hela systemet med ett kommando: docker compose up.
#
# Två saker värda att veta om layouten:
#   1. De fyra tjänsternas Dockerfiles bygger med context: . (repo-roten),
#      inte context: ./services/<namn> — de behöver kunna COPY:a
#      packages/shared och packages/contracts. Se kommentaren högst upp i
#      varje Dockerfile.
#   2. Portarna publiceras till localhost bara för att göra utveckling och
#      felsökning bekvämt (curl mot en enskild tjänst utan att gå via
#      nginx). I en riktig driftsättning skulle bara nginx (och Postgres,
#      om en extern klient behöver den) exponeras utåt — se planens
#      "Säkerhet: Transportnära grunder": interna S2S-endpoints ska aldrig
#      nås direkt utifrån.

services:
  db:
    image: postgres:15-alpine
    container_name: invoice_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Kör alla migrationer mot den gemensamma databasen och avslutar sig
  # själv. Tjänster som rör databasen väntar på att den lyckats.
  migrate:
    build:
      context: .
      dockerfile: infra/migrate/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  # Engångscontainer: provisionerar S2S-klienter i service_clients (t.ex.
  # documents-klienten som fas 4 behöver för att hämta snapshoten från
  # billing). Kör efter migrate, före tjänsterna. Vägrar köra i
  # produktionsläge (code-style.md #24).
  seed:
    build:
      context: .
      dockerfile: infra/seed/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-development}
      DOCUMENTS_CLIENT_ID: ${DOCUMENTS_CLIENT_ID}
      DOCUMENTS_CLIENT_SECRET: ${DOCUMENTS_CLIENT_SECRET}
      DOCUMENTS_CLIENT_SCOPES: ${DOCUMENTS_CLIENT_SCOPES}
      PAYMENTS_CLIENT_ID: ${PAYMENTS_CLIENT_ID}
      PAYMENTS_CLIENT_SECRET: ${PAYMENTS_CLIENT_SECRET}
      PAYMENTS_CLIENT_SCOPES: ${PAYMENTS_CLIENT_SCOPES}
      # Drift-konto, inte en tjänst — se infra/seed/seed.ts. Ingen körande
      # tjänst behöver de här uppgifterna, bara seed-steget som skapar
      # kontot en operatör senare loggar in med.
      PAYMENTS_OPS_CLIENT_ID: ${PAYMENTS_OPS_CLIENT_ID}
      PAYMENTS_OPS_CLIENT_SECRET: ${PAYMENTS_OPS_CLIENT_SECRET}
      PAYMENTS_OPS_CLIENT_SCOPES: ${PAYMENTS_OPS_CLIENT_SCOPES}
      # Drift-konto för POST /internal/automation/run (fas 6) — samma
      # motivering som PAYMENTS_OPS_CLIENT_* ovan.
      BILLING_OPS_CLIENT_ID: ${BILLING_OPS_CLIENT_ID}
      BILLING_OPS_CLIENT_SECRET: ${BILLING_OPS_CLIENT_SECRET}
      BILLING_OPS_CLIENT_SCOPES: ${BILLING_OPS_CLIENT_SCOPES}
      # billing SJÄLV, för GET /internal/ops/alerts S2S mot payments (fas 7)
      # och GET /portal/invoices/:id/pdf S2S mot documents (fas 9).
      BILLING_CLIENT_ID: ${BILLING_CLIENT_ID}
      BILLING_CLIENT_SECRET: ${BILLING_CLIENT_SECRET}
      BILLING_CLIENT_SCOPES: ${BILLING_CLIENT_SCOPES}
      # auth SJÄLV, för POST /auth/customer-invites S2S mot billing (fas 9).
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      AUTH_CLIENT_SCOPES: ${AUTH_CLIENT_SCOPES}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Fas 7: sätter LOGIN-lösenordet för de fyra tjänsternas Postgres-roller
  # (skapade, NOLOGIN, i migrations/0008_service_roles.js). Engångscontainer,
  # samma mönster som rabbitmq-init nedan — postgres:15-alpine ger psql utan
  # ett eget Dockerfile. Kör EFTER migrate (rollerna måste redan finnas) och
  # FÖRE de fyra tjänsterna (som kopplar upp med just de här lösenorden).
  postgres-init:
    image: postgres:15-alpine
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      DOCUMENTS_DB_PASSWORD: ${DOCUMENTS_DB_PASSWORD}
    volumes:
      - ./infra/postgres/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    container_name: invoice_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: invoice_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      # Utan ett explicit värde genererar entrypoint-skriptet ett eget
      # .erlang.cookie vid uppstart — det steget har visat sig kunna krascha
      # containern med "Error when reading /var/lib/rabbitmq/.erlang.cookie:
      # eacces" på vissa Docker-installationer (observerat lokalt under
      # fas 5-arbetet, orört av själva payments-koden). Ett fast värde här
      # gör att entrypoint aldrig behöver skriva filen alls.
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 15s
      # RabbitMQ tar 30-40 s att bli "check_running"-frisk kallt när hela
      # stacken byggts och startar samtidigt. Generös start_period +
      # start_interval (pollar tätt under uppstart) så starten inte blir flaky.
      retries: 10
      start_period: 90s
      start_interval: 3s

  # Engångscontainer: skapar en RabbitMQ-användare per tjänst (se
  # infra/rabbitmq/init.sh) och avslutar sig själv. De fyra tjänsterna
  # väntar på att den lyckats innan de får starta — annars finns kontona
  # inte än när tjänsterna försöker logga in.
  rabbitmq-init:
    image: curlimages/curl:8.10.1
    container_name: invoice_rabbitmq_init
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      AUTH_RABBITMQ_PASSWORD: ${AUTH_RABBITMQ_PASSWORD}
      BILLING_RABBITMQ_PASSWORD: ${BILLING_RABBITMQ_PASSWORD}
      PAYMENTS_RABBITMQ_PASSWORD: ${PAYMENTS_RABBITMQ_PASSWORD}
      DOCUMENTS_RABBITMQ_PASSWORD: ${DOCUMENTS_RABBITMQ_PASSWORD}
    volumes:
      - ./infra/rabbitmq/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]

  # S3-kompatibel lagring för lokal utveckling/CI. Var tidigare MinIO
  # (quay.io/minio/minio + quay.io/minio/mc för bucket-/nyckelsetup) —
  # bytt 2026-09-29 sedan MinIO stängde publik åtkomst till sina images
  # helt, på både Docker Hub och quay.io (samma sak som redan en gång
  # tvingade ett byte FRÅN Docker Hub TILL quay.io, se git-historiken för
  # den här filen). Verifierat innan bytet: samma fel (401/unauthorized)
  # dyker upp mot docker.io, quay.io OCH ghcr.io — inte en tillfällig
  # quay.io-hicka.
  #
  # adobe/s3mock: en JVM-baserad testdubblett byggd specifikt för att
  # testa S3-klientkod mot, inte ett riktigt lagringssystem som råkar
  # kunna användas så. Konsekvensen: den har inget IAM/policy-system —
  # den validerar varken åtkomstnycklar eller presignerade URL:ers
  # signatur/förfallotid (se dokumentationen). documents-tjänstens EGNA,
  # bucket-begränsade nyckel (PR-granskning fas 4, punkt 13) är alltså
  # bara meningsfull mot en RIKTIG S3-driftsättning nu — här är den kvar
  # som namn/miljövariabel för att koden ska vara identisk mot prod, men
  # ger ingen faktisk isolering mot den här mocken. Ingen separat
  # init-container behövs längre: bucketen skapas av s3mock själv vid
  # uppstart via COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS.
  s3:
    image: adobe/s3mock:latest
    container_name: invoice_s3
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-invoices}
    ports:
      - "${S3_PORT}:9090"
    healthcheck:
      # Ingen /health-endpoint dokumenterad (bara actuator, avstängt som
      # standard) — roten svarar 200 så fort Tomcat är uppe, vilket räcker
      # för att veta att API:et tar emot anrop. JVM-kallstart tar märkbart
      # längre än MinIOs gamla healthcheck gjorde — därav den generösa
      # start_period.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 45s

  mailpit:
    image: axllent/mailpit:latest
    container_name: invoice_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── De fyra tjänsterna ──────────────────────────────────────────────────
  # healthcheck pekar mot /health/ready (kollar faktiska beroenden: Postgres/
  # RabbitMQ/Redis), inte /health/live (kollar bara att processen lever) —
  # se packages/shared/src/health. Det är /health/ready Docker och nginx ska
  # agera på; /health/live är till för omstartsbeslut hos en orkestrerare så
  # en tillfälligt onåbar databas inte får en frisk process omstartad i onödan.

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    environment:
      PORT: ${AUTH_PORT}
      # Fas 7: egen, restriktiv Postgres-roll (GRANT bara på egna tabeller
      # + SELECT/INSERT/UPDATE på event_outbox — migrations/0008_service_roles.js),
      # inte den delade superusern DATABASE_URL. Samma mönster som RABBITMQ_URL
      # nedan har använt sedan fas 0.
      DATABASE_URL: postgresql://auth:${AUTH_DB_PASSWORD}@db:5432/${DB_NAME}
      RABBITMQ_URL: amqp://auth:${AUTH_RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL}
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_DEV_ENDPOINTS: ${AUTH_DEV_ENDPOINTS:-false}
      JWT_USER_SECRET: ${JWT_USER_SECRET}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER}
      AUTH_STRICT_RATE_LIMIT_MAX: ${AUTH_STRICT_RATE_LIMIT_MAX:-10}
      BANKID_PROVIDER: ${BANKID_PROVIDER:-mock}
      # Fas 11: bara relevanta när BANKID_PROVIDER=real. Sökvägarna pekar in
      # i containern, dit ./secrets/bankid är monterad nedan (volumes) — inte
      # sökvägen på värdmaskinen.
      BANKID_BASE_URL: ${BANKID_BASE_URL:-https://appapi2.test.bankid.com/rp/v6.0}
      BANKID_CERT_PATH: ${BANKID_CERT_PATH:-}
      BANKID_CERT_PASSPHRASE: ${BANKID_CERT_PASSPHRASE:-}
      BANKID_CA_PATH: ${BANKID_CA_PATH:-}
      JWT_SERVICE_SECRET: ${JWT_SERVICE_SECRET}
      PNR_HMAC_KEY: ${PNR_HMAC_KEY}
      # Grov global missbruckspärr (packages/shared/src/service/index.ts),
      # inte den finkorniga strypningen ovan. Höjs i .env/CI — se den
      # filens kommentar om varför (PR-granskning fas 5).
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      # Fas 9: POST /auth/customer-invites validerar customerId mot billing
      # S2S innan en users-rad skrivs — samma mönster som billings
      # AUTH_BASE_URL/BILLING_CLIENT_ID (services/billing/src/config.ts).
      # AUTH_BASE_URL pekar på auth SJÄLV (samma tjänste-token-flöde som
      # varje annan S2S-klient, se services/auth/src/billing-client.ts).
      BILLING_BASE_URL: http://billing:${BILLING_PORT}
      AUTH_BASE_URL: http://auth:${AUTH_PORT}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      AUTH_CLIENT_SCOPES: ${AUTH_CLIENT_SCOPES}
      CUSTOMER_INVITE_TTL_DAYS: ${CUSTOMER_INVITE_TTL_DAYS:-7}
    # Fas 11: BankID-certifikatet (P12 + CA-rot). secrets/bankid/ committas
    # aldrig (git.md #9, .gitignore) — bara relevant när BANKID_PROVIDER=real.
    volumes:
      - ./secrets/bankid:/run/secrets/bankid:ro
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:${AUTH_PORT}/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    ports:
      - "${BILLING_PORT}:${BILLING_PORT}"
    environment:
      PORT: ${BILLING_PORT}
      # Fas 7: egen, restriktiv Postgres-roll — se auth-tjänstens kommentar
      # ovan. billing har DESSUTOM SELECT på tenants (isTenantActive,
      # listActiveTenantIds) — det ENA dokumenterade, kvarstående
      # tjänstegränsundantaget, se migrations/0008_service_roles.js.
      DATABASE_URL: postgresql://billing:${BILLING_DB_PASSWORD}@db:5432/${DB_NAME}
      RABBITMQ_URL: amqp://billing:${BILLING_RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL}
      NODE_ENV: ${NODE_ENV:-development}
      # Verifierar användar-JWT (aud: api) och tjänste-JWT (aud: internal) —
      # samma hemligheter som auth SIGNERAR med (HS256, planens Säkerhet).
      JWT_USER_SECRET: ${JWT_USER_SECRET}
      JWT_SERVICE_SECRET: ${JWT_SERVICE_SECRET}
      # Personnummer för privatkunder: kryptering + HMAC-uppslag, två skilda
      # nycklar. PNR_HMAC_KEY delas med auth så BankID kan slå upp kunden.
      PNR_ENCRYPTION_KEY: ${PNR_ENCRYPTION_KEY}
      PNR_HMAC_KEY: ${PNR_HMAC_KEY}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      # Fas 7: S2S mot payments (unknown-bankgiro) för GET /internal/ops/alerts
      # — samma mönster som payments BILLING_BASE_URL/PAYMENTS_CLIENT_ID.
      # Fas 9: S2S mot documents (signerad PDF-URL) för GET /portal/
      # invoices/:id/pdf, samma BILLING_CLIENT_* identitet.
      AUTH_BASE_URL: http://auth:${AUTH_PORT}
      PAYMENTS_BASE_URL: http://payments:${PAYMENTS_PORT}
      DOCUMENTS_BASE_URL: http://documents:${DOCUMENTS_PORT}
      BILLING_CLIENT_ID: ${BILLING_CLIENT_ID}
      BILLING_CLIENT_SECRET: ${BILLING_CLIENT_SECRET}
      BILLING_CLIENT_SCOPES: ${BILLING_CLIENT_SCOPES}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:${BILLING_PORT}/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    ports:
      - "${PAYMENTS_PORT}:${PAYMENTS_PORT}"
    environment:
      PORT: ${PAYMENTS_PORT}
      # Fas 7: egen, restriktiv Postgres-roll — se auth-tjänstens kommentar
      # ovan. GRANT bara på bank_transactions + idempotency_keys/
      # event_outbox — INGEN åtkomst till invoices (nås bara via
      # BILLING_BASE_URL nedan, aldrig SQL).
      DATABASE_URL: postgresql://payments:${PAYMENTS_DB_PASSWORD}@db:5432/${DB_NAME}
      RABBITMQ_URL: amqp://payments:${PAYMENTS_RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL}
      NODE_ENV: ${NODE_ENV:-development}
      # Verifierar användar-JWT (/admin/payments/*) och tjänste-JWT
      # (/internal/*) — samma hemligheter som auth SIGNERAR med.
      JWT_USER_SECRET: ${JWT_USER_SECRET}
      JWT_SERVICE_SECRET: ${JWT_SERVICE_SECRET}
      # HMAC över rå body på POST /webhooks/payment (mockbanken).
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      # S2S mot billing (bankgiro->tenant, OCR/id->faktura) och auth
      # (tjänste-token) — samma mönster som documents BILLING_BASE_URL/
      # AUTH_BASE_URL/klientuppgifter.
      BILLING_BASE_URL: http://billing:${BILLING_PORT}
      AUTH_BASE_URL: http://auth:${AUTH_PORT}
      PAYMENTS_CLIENT_ID: ${PAYMENTS_CLIENT_ID}
      PAYMENTS_CLIENT_SECRET: ${PAYMENTS_CLIENT_SECRET}
      PAYMENTS_CLIENT_SCOPES: ${PAYMENTS_CLIENT_SCOPES}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      # Fas 10: portalbetalning via Stripe. STRIPE_PROVIDER=mock i dev/CI
      # (architecture.md #25, mock-undantaget) — STRIPE_SECRET_KEY behövs
      # bara i "real"-läget. STRIPE_WEBHOOK_SECRET krävs alltid, mocken
      # inräknad (services/payments/src/config.ts). PORTAL_BASE_URL
      # används för success_url/cancel_url på Checkout-sessionen — måste
      # vara nåbar från KUNDENS webbläsare, inte det interna Docker-nätet
      # (samma resonemang som S3_PUBLIC_ENDPOINT nedan för documents).
      STRIPE_PROVIDER: ${STRIPE_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:5174}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:${PAYMENTS_PORT}/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  documents:
    build:
      context: .
      dockerfile: services/documents/Dockerfile
    ports:
      - "${DOCUMENTS_PORT}:${DOCUMENTS_PORT}"
    environment:
      PORT: ${DOCUMENTS_PORT}
      # Fas 7: egen, restriktiv Postgres-roll — se auth-tjänstens kommentar
      # ovan. GRANT bara på documents/email_outbox/email_webhook_events +
      # processed_events/event_outbox.
      DATABASE_URL: postgresql://documents:${DOCUMENTS_DB_PASSWORD}@db:5432/${DB_NAME}
      RABBITMQ_URL: amqp://documents:${DOCUMENTS_RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL}
      NODE_ENV: ${NODE_ENV:-development}
      # Verifierar tjänste-JWT (aud: internal). ALDRIG JWT_USER_SECRET —
      # documents har inga användar-endpoints (planens Säkerhet #1).
      JWT_SERVICE_SECRET: ${JWT_SERVICE_SECRET}
      # S3 (adobe/s3mock lokalt/CI, en riktig S3-bucket i produktion).
      # S3_ENDPOINT nås internt; S3_PUBLIC_ENDPOINT används i signerade
      # URL:er som en webbläsare (fas 9-portalen) ska kunna följa.
      S3_ENDPOINT: http://s3:9090
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${S3_PORT}}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-invoices}
      # I produktion: EGEN nyckel, begränsad till S3_BUCKET (PR-granskning
      # fas 4, punkt 13) — se kommentaren vid s3-tjänsten ovan för varför
      # den begränsningen inte har någon effekt mot testdubbletten här.
      S3_ACCESS_KEY_ID: ${DOCUMENTS_S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${DOCUMENTS_S3_SECRET_ACCESS_KEY}
      PDF_URL_TTL_SECONDS: ${PDF_URL_TTL_SECONDS:-900}
      # SMTP (Mailpit — ingen TLS/auth lokalt). En riktig leverantör i
      # produktion sätter SMTP_START_TLS/SMTP_USERNAME/SMTP_PASSWORD.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_START_TLS: ${SMTP_START_TLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-fakturor@faktura.test}
      # HMAC över rå body på POST /webhooks/email-status.
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET}
      # S2S mot billing (snapshot) och auth (tjänste-token).
      BILLING_BASE_URL: http://billing:${BILLING_PORT}
      AUTH_BASE_URL: http://auth:${AUTH_PORT}
      DOCUMENTS_CLIENT_ID: ${DOCUMENTS_CLIENT_ID}
      DOCUMENTS_CLIENT_SECRET: ${DOCUMENTS_CLIENT_SECRET}
      DOCUMENTS_CLIENT_SCOPES: ${DOCUMENTS_CLIENT_SCOPES}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      # Samma idé som ovan, fast med Pythons inbyggda urllib i stället för
      # Bun/fetch, eftersom det är Python-imagen som kör den här tjänsten.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${DOCUMENTS_PORT}/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: invoice_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      billing:
        condition: service_healthy
      payments:
        condition: service_healthy
      documents:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
